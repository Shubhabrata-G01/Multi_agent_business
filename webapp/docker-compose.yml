# Self-hosted deployment demonstration (STEP 7 item 7): PostgreSQL, a
# migration step, the web process, and the durable worker process (STEP 7
# item 8's required components), all from one image (Dockerfile). NOT a
# substitute for a managed Postgres in real production (see README.md
# "Backup and restore"), but a complete, runnable reference for how the
# pieces fit together.
#
# Usage:
#   cp .env.local.example .env.production   # fill in real secrets
#   docker compose --env-file .env.production up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - webapp-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: build }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: { context: ., target: web }
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Scale horizontally with: docker compose up --scale worker=3
    # (claiming is safe across replicas - see lib/jobs/jobRepository.ts)

volumes:
  webapp-pg-data:
