name: CI

# Runs the webapp test suite, typecheck, and production build on every pull
# request to main and on pushes to the main/sprint2 branches. The tests read the
# sibling company/ directory (COMPANY_DIR defaults to <cwd>/../company), which is
# present because the whole repo is checked out and the job runs in webapp/.
on:
  push:
    branches: [main, sprint2]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    services:
      # Backs the PostgreSQL-repository tests (lib/db/*.test.ts) and the
      # migration-deploy step below - see webapp/README.md's "Storage
      # backend" section.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: webapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/webapp_ci
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Unit tests (vitest)
        run: npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
